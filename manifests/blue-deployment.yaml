apiVersion: apps/v1
kind: Deployment
metadata:
  name: iwallet-app-blue
  namespace: iwallet-app
  
spec:
  replicas: 5
  selector:
    matchLabels:
      app: iwallet-app
  template:
    metadata:
      labels:
        app: iwallet-app
        version: blue
    spec:
      imagePullSecrets: 
        - name: ghcr-secret
      containers:
        - name: iwallet-app-container
          image: ghcr.io/abobkeryousif/iwallet:d43bb7e43de9aaf6600f49fa0447a3be5abb724a
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env:
            - name: Database__Enabled
              value:  "false"
          resources:
            limits:
              memory: "300Mi" 
              cpu: "500m"
            requests:
              memory: "200Mi"
              cpu: "350m"
