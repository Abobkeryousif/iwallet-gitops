apiVersion: apps/v1
kind: Deployment
metadata:
  name: iwallet-app-green
  namespace: iwallet-app

spec:
  replicas: 5
  selector:
    matchLabels:
      app: iwallet-app
  template:
    metadata:
      labels:
        app: iwallet-app
        version: green
    spec:
      imagePullSecrets: 
        - name: ghcr-secret
      containers:
        - name: iwallet-app-container
          image: ghcr.io/abobkeryousif/iwallet:f2a56116974aca0b1ed5f92565eb50e244c8adf6
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env:
            - name: Database__Enabled
              value:  "false"
          resources:
            limits:
              memory: "300Mi" 
              cpu: "500m"
            requests:
              memory: "200Mi"
              cpu: "350m"
    



